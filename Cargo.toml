[package]
name = "relay-curve-estimator"
version = "0.2.0"
edition = "2021"
authors = ["Relay Curve Estimator Contributors"]
description = "High-performance native Rust GUI application for estimating and analyzing protection relay time-current characteristic (TCC) curves."
readme = "README.md"

[dependencies]
eframe = { version = "0.31", default-features = true }
egui_plot = "0.31"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
rfd = "0.15"
arboard = "3.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
